name: Publish Primarix update

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build and publish Windows launchers
    runs-on: windows-2022
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17 and Java 8
        id: java17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Java 8 for ForgeGradle
        id: java8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Configure Java build toolchains
        shell: pwsh
        run: |
          "JAVA_HOME=${{ steps.java17.outputs.path }}" >> $env:GITHUB_ENV
          "JAVA8_HOME=${{ steps.java8.outputs.path }}" >> $env:GITHUB_ENV

      - name: Set up Gradle 2.14.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 2.14.1

      - name: Select Gradle 2.14.1 for ForgeGradle
        shell: pwsh
        run: |
          $gradleHome = Join-Path $env:RUNNER_TEMP '.gradle-actions\gradle-installations\installs\gradle-2.14.1'
          if (!(Test-Path (Join-Path $gradleHome 'bin\gradle.bat'))) {
            throw "Gradle 2.14.1 was not provisioned at $gradleHome."
          }
          "GRADLE_HOME=$gradleHome" >> $env:GITHUB_ENV

      - name: Check release tag matches package version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME must match package.json version v$version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "package.json version must be a numeric major.minor.patch version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: |
          npm test
          npm run test:ui
          npm run test:java

      - name: Build portable and installer clients
        run: npm run package:release

      - name: Publish GitHub release for the updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Primarix Client ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-primarix-portable/Primarix-Client-Portable-${{ steps.version.outputs.version }}.exe
            release-primarix-portable/Primarix-Client-Setup-${{ steps.version.outputs.version }}.exe
